<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - Mini Pharmacy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fb; }
        .topbar { background: #198754; color: white; padding: 18px 0; }
        .box { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,.08); }
    </style>
</head>
<body>

<div class="topbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-0">Employee Point of Sale (POS)</h4>
            <small id="username-display"></small>
        </div>
        <button onclick="logout()" class="btn btn-light btn-sm fw-bold">Logout</button>
    </div>
</div>

<div class="container py-4">
    <div id="message"></div>

    <div class="row g-4">
        <!-- 1. SEHEMU YA KUUZA DAWA -->
        <div class="col-md-7">
            <div class="card box p-3">
                <h5 class="fw-bold mb-3 text-success">Sell Medicine</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Drug</th>
                                <th>Selling Price</th>
                                <th>Stock</th>
                                <th style="width: 120px;">Quantity</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="drugsTable">
                            <tr><td colspan="5" class="text-center text-muted">Inapakia dawa...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2. SEHEMU YA TODAY'S SALES -->
        <div class="col-md-5">
            <div class="card box p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0 text-dark">Today's Sales</h5>
                    <span class="badge bg-primary fs-6" id="totalSoldToday">Total sold today: Tsh 0</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Total Price</th>
                            </tr>
                        </thead>
                        <tbody id="todaySalesTable">
                            <tr><td colspan="3" class="text-center text-muted">Bado hujauza dawa leo.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const userId = localStorage.getItem("user_id");
const role = localStorage.getItem("role");
const username = localStorage.getItem("username");

if (!userId || role !== "EMPLOYEE") {
    window.location.href = "/";
} else {
    document.getElementById("username-display").innerText = "Logged in as: " + username;
}

// 1. Pakia Orodha ya Dawa Zilizopo
async function loadDrugs() {
    try {
        const response = await fetch('/api/drugs/');
        const drugs = await response.json();
        const tbody = document.getElementById("drugsTable");

        tbody.innerHTML = "";

        drugs.forEach(drug => {
            tbody.innerHTML += `
                <tr>
                    <td class="fw-bold">${drug.name}</td>
                    <td>Tsh ${drug.selling_price}</td>
                    <td><span class="badge ${drug.stock_quantity > 0 ? 'bg-success' : 'bg-danger'}">${drug.stock_quantity}</span></td>
                    <td>
                        <input type="number" id="qty-${drug.id}" class="form-control form-control-sm" min="1" max="${drug.stock_quantity}" value="1">
                    </td>
                    <td>
                        <button onclick="sellDrug(${drug.id})" class="btn btn-success btn-sm fw-bold" ${drug.stock_quantity < 1 ? 'disabled' : ''}>
                            SELL
                        </button>
                    </td>
                </tr>`;
        });
    } catch (err) {
        console.error("Error loading drugs:", err);
    }
}

// 2. Fanya Mauzo ya Dawa
async function sellDrug(drugId) {
    const qtyInput = document.getElementById(`qty-${drugId}`);
    const quantity = parseInt(qtyInput.value);
    const messageBox = document.getElementById("message");

    if (!quantity || quantity < 1) {
        alert("Weka idadi sahihi!");
        return;
    }

    try {
        const response = await fetch('/api/sales/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                drug: drugId,
                quantity: quantity,
                employee: parseInt(userId)
            })
        });

        const data = await response.json();

        if (response.ok) {
            messageBox.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    Sale completed successfully. Total sold: Tsh ${data.total_amount}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;

            await loadTodaySales();
            await loadDrugs();
        } else {
            messageBox.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    ${data.error || 'Mauzo yameshindikana! Check stock.'}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }
    } catch (err) {
        messageBox.innerHTML = `<div class="alert alert-danger">Server connection error.</div>`;
    }
}

// 3. Pakia Mauzo ya Leo
async function loadTodaySales() {
    try {
        const response = await fetch(`/api/sales/employee-today/?employee_id=${userId}`);
        const data = await response.json();

        const tbody = document.getElementById("todaySalesTable");
        tbody.innerHTML = "";

        if (!response.ok || !data.sales || data.sales.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Bado hujauza dawa leo.</td></tr>`;
            document.getElementById("totalSoldToday").innerText = "Total sold today: Tsh 0";
            return;
        }

        data.sales.forEach(sale => {
            // Field jipya la bei za leo
            const amount = sale.total_price || sale.total_amount || 0;
            tbody.innerHTML += `
                <tr>
                    <td class="fw-bold">${sale.drug_name}</td>
                    <td>Qty ${sale.quantity}</td>
                    <td>Tsh ${parseFloat(amount).toLocaleString()}</td>
                </tr>`;
        });

        const grandTotal = data.total_sold_today || 0;
        document.getElementById("totalSoldToday").innerText = `Total sold today: Tsh ${parseFloat(grandTotal).toLocaleString()}`;

    } catch (err) {
        console.error("Error loading today sales:", err);
    }
}

function logout() {
    localStorage.clear();
    window.location.href = "/";
}

// Mara tu ukurasa unapofunguka
loadDrugs();
loadTodaySales();
</script>

</body>
</html>
